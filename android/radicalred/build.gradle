plugins {
    id "com.android.application"
}

// Opt-in (see settings.gradle): the hash is YOUR patched ROM's, never guessed.
//   -PradicalRedSha1=<sha1>  [-PradicalRedRomSize=<bytes>]  [-PradicalRedCrc32=0x<crc>]
def sha1 = providers.gradleProperty("radicalRedSha1").get().trim().toLowerCase()
if (!(sha1 ==~ /[0-9a-f]{40}/))
    throw new GradleException("radicalRedSha1 must be a 40-character hex SHA-1")
if (sha1 == "41cb23d8dccc8ebd7c649cd8fbb58eeace6e2fdc")
    throw new GradleException("radicalRedSha1 is the UNPATCHED FireRed hash; apply the " +
        "Radical Red patch first (variants/radicalred/baserom.md)")
// CFRU-based hacks expand the cartridge to 32 MB; override if your dump differs.
def romSize = (providers.gradleProperty("radicalRedRomSize").orNull ?: "33554432") as long
def crc32 = providers.gradleProperty("radicalRedCrc32").orNull ?: "0x00000000"

// Render the runtime TOML with the hash at configuration time.
def tomlOut = layout.buildDirectory.file("generated/frlg/game_android.toml").get().asFile
tomlOut.parentFile.mkdirs()
tomlOut.text = file("game_android.toml.in").text.replace("@RADICALRED_SHA1@", sha1)

ext.frlg = [
    applicationId : "com.frlgrecomp.radicalred",
    title         : "Pokémon Radical Red",
    romLabel      : "Pokémon Radical Red ROM (patched FireRed v1.0)",
    romSha1       : [sha1],
    romSize       : romSize,
    romFile       : "radicalred.gba",
    variant       : "radicalred",
    gameToml      : tomlOut,
    cmakeArguments: ["-DRADICALRED_ROM_SHA1=${sha1}", "-DRADICALRED_ROM_CRC32=${crc32}"],
]

apply from: new File(rootDir, "frlg-game.gradle")
