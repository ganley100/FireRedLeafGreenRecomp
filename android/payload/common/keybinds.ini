# keybinds.ini — default Android / Google TV key layout (recomp-ui format).
#
# Keyboard-style keys only. A Bluetooth/USB gamepad needs no entry here: the
# runtime maps it automatically (A, B, Back = Select, Start, D-pad, L/R).
#
# A Google TV remote's D-pad arrives as arrow keys and its OK/centre button as
# "Select" (SDL's name for Android DPAD_CENTER). Remote Back is reserved by the
# runtime for its settings menu. Play/Pause and Menu exist on some remotes
# only — use a gamepad if yours lacks them.
#
# This file is re-installed when the app's payload version changes.
[player1]
a = Select
b = AudioPlay
select = Menu
start = Return
up = Up
down = Down
left = Left
right = Right
l = C
r = V
